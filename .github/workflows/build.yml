name: Build and publish NuGet package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AvaranFlow.sln

      - name: Build solution (Release)
        run: dotnet build AvaranFlow.sln --configuration Release --no-restore

      - name: Run automated test suites
        run: dotnet test AvaranFlow.sln --configuration Release --no-build --verbosity normal

      - name: Build NuGet packages
        run: dotnet pack AvaranFlow.sln --configuration Release --no-build --output artifacts

      - name: Exchange GitHub OIDC token for NuGet key
        uses: NuGet/login@v1
        id: nuget-login
        continue-on-error: true
        with:
          user: HiteshBhanushali-Techmaster

      - name: Publish NuGet packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          Get-ChildItem -Path artifacts -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Publishing package $($_.Name)..."
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
          Get-ChildItem -Path artifacts -Filter "*.snupkg" | ForEach-Object {
            Write-Host "Publishing symbols $($_.Name)..."
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
